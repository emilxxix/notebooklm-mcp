<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Moni 🌸 — จดพอร์ตด้วยแชท</title>
<style>
  :root{
    --page:#fdf1f6; --surface:#ffffff; --surface2:#ffe8f0; --surface3:#fff7fa;
    --ink:#3b1f31; --ink2:#85566e; --muted:#b08ea0;
    --border:rgba(224,68,124,.15); --grid:#f3dce6; --baseline:#e6c3d2;
    --accent:#e0447c; --accent-deep:#c22e66;
    --us:#2a78d6; --fund:#1baf7a; --tax:#eda100; --cash:#008300;
    --gold:#4a3aa7; --etf:#e34948; --other:#e87ba4;
    --up:#006300; --down:#d03b3b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--page);height:100%}
  body{color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;flex-direction:column;height:100dvh;overflow:hidden}

  .top{background:linear-gradient(120deg,#ff9ec3,#e0447c 70%,#c22e66);color:#fff;
       padding:calc(env(safe-area-inset-top, 0px) + 12px) 18px 12px;
       display:flex;align-items:center;justify-content:space-between;flex:none}
  .top .name{font-size:17px;font-weight:800;letter-spacing:.2px}
  .top .name small{font-weight:500;opacity:.85;font-size:11px;display:block;margin-top:1px}
  .top .mini{text-align:right}
  .top .mini .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  .top .mini .d{font-size:11px;opacity:.9;font-variant-numeric:tabular-nums}

  main{flex:1;overflow:hidden;position:relative}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
        padding:14px 14px 20px;display:none}
  .view.on{display:block}
  .inner{max-width:480px;margin:0 auto}

  .tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--border);
        padding-bottom:env(safe-area-inset-bottom, 0px)}
  .tabs button{flex:1;background:none;border:none;padding:10px 0 8px;cursor:pointer;
        font-size:11.5px;color:var(--muted);font-weight:600;font-family:inherit}
  .tabs button .ic{display:block;font-size:20px;margin-bottom:2px;filter:grayscale(1);opacity:.5}
  .tabs button.on{color:var(--accent-deep)}
  .tabs button.on .ic{filter:none;opacity:1}

  #msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
  .bub{max-width:85%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.55;
       white-space:pre-wrap;word-break:break-word;animation:pop .18s ease-out}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion: reduce){ .bub{animation:none} }
  .bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
  .bub.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);
           border-bottom-left-radius:6px;box-shadow:0 1px 4px rgba(224,68,124,.08)}
  .bub .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip-num{background:var(--surface2);border:1px solid var(--border);color:var(--accent-deep);
            padding:6px 13px;border-radius:14px;font-size:13.5px;font-weight:700;cursor:pointer;
            font-variant-numeric:tabular-nums;font-family:inherit}
  .chip-num:active{background:var(--accent);color:#fff}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .quick button{background:var(--surface);border:1px solid var(--border);color:var(--ink2);
        padding:6px 13px;border-radius:16px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .quick button:active{background:var(--surface2)}

  .inputrow{position:sticky;bottom:0;display:flex;gap:8px;padding-top:10px;
            background:linear-gradient(transparent,var(--page) 30%)}
  .inputrow .att{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);
        background:var(--surface);font-size:19px;cursor:pointer}
  .inputrow textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:22px;
        padding:11px 16px;font-size:15px;font-family:inherit;background:var(--surface);
        color:var(--ink);height:44px;line-height:1.4}
  .inputrow textarea:focus{outline:none;border-color:var(--accent)}
  .inputrow .send{flex:none;width:44px;height:44px;border-radius:50%;border:none;
        background:var(--accent);color:#fff;font-size:17px;cursor:pointer;font-weight:700}
  .inputrow .send:active{background:var(--accent-deep)}

  .hero{background:linear-gradient(135deg,#fff 0%,#fff5f9 100%);border:1px solid var(--border);
        border-radius:22px;padding:20px;margin-bottom:12px;text-align:center;
        box-shadow:0 2px 12px rgba(224,68,124,.07)}
  .hero .lbl{font-size:12px;color:var(--ink2);margin-bottom:4px}
  .hero .num{font-size:40px;font-weight:800;color:var(--accent-deep);
             font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .hero .pair{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .pill{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:16px;
        font-variant-numeric:tabular-nums}
  .pill.up{background:#e3f4e3;color:var(--up)} .pill.down{background:#fde7e7;color:var(--down)}
  .pill.flat{background:var(--surface2);color:var(--muted)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;
        padding:15px 16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(224,68,124,.05)}
  .card h2{font-size:11px;font-weight:800;color:var(--ink2);letter-spacing:.5px;
        text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .chartbox{position:relative}
  .tt{position:absolute;pointer-events:none;background:var(--ink);color:#fff;
      border-radius:9px;padding:7px 11px;font-size:12px;display:none;z-index:5;white-space:nowrap}
  .tt .t-val{font-size:14px;font-weight:700}
  .tt .t-lbl{opacity:.75;margin-top:1px}

  .legend{list-style:none;margin-top:10px}
  .legend li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
  .dot{width:9px;height:9px;border-radius:3px;flex:none}
  .legend .nm{color:var(--ink2);flex:1}
  .legend .v{font-variant-numeric:tabular-nums;font-weight:700}
  .legend .pc{color:var(--muted);width:50px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}

  .hrow{display:grid;grid-template-columns:minmax(110px,190px) 1fr 84px 46px;gap:8px;
        align-items:center;padding:5px 0}
  .hrow .nm{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .hrow .track{background:var(--surface3);border:1px solid var(--grid);border-radius:4px;height:13px}
  .hrow .fill{height:100%;border-radius:0 4px 4px 0}
  .hrow .v{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .hrow .pc{font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0}

  .fx{position:fixed;font-size:22px;pointer-events:none;z-index:99;animation:rise 1.6s ease-out forwards}
  @keyframes rise{to{transform:translateY(-130px) rotate(30deg);opacity:0}}
  @media (prefers-reduced-motion: reduce){ .fx{display:none} }
</style>
</head>
<body>

<div class="top">
  <div class="name">Moni 🌸<small>จดพอร์ตด้วยแชท</small></div>
  <div class="mini"><div class="v" id="top-total">—</div><div class="d" id="top-diff"></div></div>
</div>

<main>
  <section class="view on" id="view-chat">
    <div class="inner">
      <div id="msgs"></div>
      <div class="quick">
        <button data-q="สรุป">📊 สรุป</button>
        <button id="q-cam">📷 อ่านจากรูป</button>
        <button id="q-import">📁 นำเข้าไฟล์</button>
        <button id="q-export">💾 สำรองไฟล์</button>
      </div>
      <div class="inputrow">
        <button class="att" id="att" title="แนบรูป">📷</button>
        <textarea id="inp" rows="1" placeholder="พิมพ์ชื่อ + ตัวเลข เช่น TLUS500 6499.64"></textarea>
        <button class="send" id="send" title="ส่ง">➤</button>
      </div>
      <input type="file" id="file" accept="image/*" style="display:none">
      <input type="file" id="jfile" accept=".json" style="display:none">
    </div>
  </section>

  <section class="view" id="view-dash">
    <div class="inner">
      <div class="hero">
        <div class="lbl">สินทรัพย์รวม 💖</div>
        <div class="num" id="d-total">—</div>
        <div class="pair">
          <span class="pill flat" id="d-day">วันนี้ —</span>
          <span class="pill flat" id="d-since">ตั้งแต่เริ่ม —</span>
        </div>
      </div>

      <div class="card">
        <h2>🌷 มูลค่ารวมตามเวลา</h2>
        <div class="chartbox">
          <svg id="line" viewBox="0 0 460 210" style="width:100%;height:auto" role="img" aria-label="มูลค่ารวมตามเวลา"></svg>
          <div class="tt" id="line-tt"></div>
        </div>
      </div>

      <div class="card">
        <h2>🌱 อัตราการเปลี่ยนแปลงรายวัน (%)</h2>
        <svg id="growth" viewBox="0 0 460 150" style="width:100%;height:auto" role="img" aria-label="เปอร์เซ็นต์เปลี่ยนแปลงรายวัน"></svg>
        <div class="empty" id="growth-empty" style="display:none">ต้องมีข้อมูลอย่างน้อย 2 วัน</div>
      </div>

      <div class="card">
        <h2>🍩 สัดส่วนพอร์ต</h2>
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          <svg id="donut" width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="สัดส่วนพอร์ต"></svg>
          <ul class="legend" id="legend" style="flex:1;min-width:180px"></ul>
        </div>
      </div>

      <div class="card">
        <h2>💗 รายตัว <span id="h-asof" style="text-transform:none;font-weight:500;color:var(--muted)"></span></h2>
        <div id="holdings"></div>
        <div class="empty" id="hold-empty" style="display:none">ยังไม่มีข้อมูลรายตัว</div>
      </div>
    </div>
  </section>
</main>

<div class="tabs">
  <button class="on" data-v="chat"><span class="ic">💬</span>แชท</button>
  <button data-v="dash"><span class="ic">📊</span>สรุปพอร์ต</button>
</div>

<script>
"use strict";
/* ══ shared storage — คีย์เดียวกับแอปหลัก ══ */
const KEY3="emil_portfolio_v2", KEY2="emil_portfolio_holdings_v1", KEYL="emil_moni_learned_v1";
const SLOT={us:"var(--us)",fund:"var(--fund)",tax:"var(--tax)",cash:"var(--cash)",
            gold:"var(--gold)",etf:"var(--etf)",other:"var(--other)"};
const GROUPS=[["us","หุ้น US"],["fund","กองทุนรวม"],["tax","ลดหย่อนภาษี"],["cash","เงินสด"],
              ["gold","ทองคำ"],["etf","ETF"],["other","อื่นๆ"]];
const GNAME=Object.fromEntries(GROUPS);
const DEF_ACCOUNTS=[
  {id:"dime",  name:"Dime! หุ้น US",          grp:"us",   cur:"USD", off:false},
  {id:"wxgen", name:"WealthX ทั่วไป",          grp:"fund", cur:"THB", off:false},
  {id:"wxtax", name:"WealthX ลดหย่อนภาษี",     grp:"tax",  cur:"THB", off:false},
  {id:"bank",  name:"เงินสด • ธนาคาร",         grp:"cash", cur:"THB", off:false},
  {id:"dsave", name:"เงินสด • Dime Save",      grp:"cash", cur:"THB", off:false},
  {id:"fcd",   name:"เงินสด • Dime FCD (ดอกเบี้ย 4.5%)", grp:"cash", cur:"USD", off:false},
];
const WALLET_ALIASES={
  dime:["dime","ไดม์"], wxgen:["wxgen","กองทุนทั่วไป","กองทั่วไป"],
  wxtax:["wxtax","ลดหย่อน","กองภาษี"], bank:["bank","ธนาคาร","แบงค์"],
  dsave:["dsave"], fcd:["fcd"],
};

function jload(k){ try{const s=localStorage.getItem(k); if(s) return JSON.parse(s);}catch(e){} return null; }
function jsave(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
let db=jload(KEY3);
if(!db){ db={accounts:JSON.parse(JSON.stringify(DEF_ACCOUNTS)),entries:[]}; jsave(KEY3,db); }
let holds=jload(KEY2)||{snaps:[]};
if(holds && !holds.snaps) holds={snaps:[{asof:holds.asof||"",items:holds.items||[]}]};
let learned=jload(KEYL)||{};   /* ชื่อที่บอทเคยถามแล้วจำไว้: {nameLower:{name,grp,cur}} */
const KEYFX="emil_moni_fx_v1";
let fxmap=jload(KEYFX)||{};    /* เรทรายวัน: {"2026-07-08":33.5, ...} */

/* ── ซ่อมข้อมูลเสียจากเวอร์ชันก่อน (เรทหลุดช่วง 15-60, entry ว่างเปล่า 0฿) ── */
(function sanitize(){
  let dirty=false;
  let lastGood=33.28;
  db.entries.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(e=>{
    if(e.fx>=15&&e.fx<=60){ lastGood=e.fx; }
    else{ e.fx=lastGood; dirty=true; }
  });
  const n=db.entries.length;
  db.entries=db.entries.filter(e=>e.vals&&Object.keys(e.vals).length>0);
  if(db.entries.length!==n) dirty=true;
  if(dirty) jsave(KEY3,db);
  Object.keys(fxmap).forEach(k=>{ if(!(fxmap[k]>=15&&fxmap[k]<=60)){ delete fxmap[k]; jsave(KEYFX,fxmap); } });
})();

const fmt=(n,d=2)=>Number(n).toLocaleString("th-TH",{minimumFractionDigits:d,maximumFractionDigits:d});
const sorted=()=>db.entries.slice().sort((a,b)=>a.date<b.date?-1:1);
const accById=id=>db.accounts.find(a=>a.id===id);
function thbVal(e,id){ const v=e.vals[id]; if(v==null)return 0;
  const a=accById(id); return (a&&a.cur==="USD")?v*e.fx:v; }
const totalOf=e=>Object.keys(e.vals).reduce((s,id)=>s+thbVal(e,id),0);
const grpColor=k=>SLOT[k]||SLOT.other;
const sign=n=>n>=0?"+":"−";
const cls=n=>n>0.005?"up":n<-0.005?"down":"flat";
const today=()=>new Date().toISOString().slice(0,10);
/* ── เรทของวันไหนก็ตาม: ดูจาก fx diary + entry ที่ใกล้วันนั้นที่สุด (ย้อนหลัง) ── */
function fxOn(dateStr){
  let best=null, bestDate="";
  Object.keys(fxmap).forEach(k=>{ if(k<=dateStr && k>=bestDate){ bestDate=k; best=fxmap[k]; } });
  sorted().forEach(e=>{ if(e.date<=dateStr && e.date>=bestDate && e.fx>=15 && e.fx<=60){
    bestDate=e.date; best=e.fx; } });
  return best!=null?best:33.28;
}
function fxPrevBefore(dateStr){
  let best=null, bestDate="";
  Object.keys(fxmap).forEach(k=>{ if(k<dateStr && k>=bestDate){ bestDate=k; best=fxmap[k]; } });
  sorted().forEach(e=>{ if(e.date<dateStr && e.date>=bestDate && e.fx>=15 && e.fx<=60){
    bestDate=e.date; best=e.fx; } });
  return best;
}
const lastFx=()=>fxOn(today());
function latestSnap(){
  if(!holds.snaps.length) return null;
  return holds.snaps.slice().sort((a,b)=>a.asof<b.asof?-1:1)[holds.snaps.length-1];
}
function normGrp(g){ return g==="dime"?"us":g==="gen"?"fund":g; }
function holdThb(h,fx){ return h.cur==="USD"?h.val*fx:h.val; }
function cashOf(e){ if(!e) return 0;
  return Object.keys(e.vals).reduce((s,id)=>{const a=accById(id);
    return s+((a&&a.grp==="cash")?thbVal(e,id):0);},0); }
function snapTotal(s){
  const fx=fxOn(s.asof);
  return s.items.reduce((t,h)=>t+holdThb(h,fx),0);
}
function holdingsTotal(){
  const s=latestSnap(); if(!s) return null;
  const es=sorted();
  return snapTotal(s)+cashOf(es[es.length-1]);
}
/* อนุกรมมูลค่ารวมตามเวลา: ใช้บันทึกกระเป๋าเป็นหลัก ถ้าไม่มีใช้ snapshot รายตัว */
function seriesTotals(){
  const es=sorted();
  if(es.length) return es.map(e=>({date:e.date,total:totalOf(e)}));
  return holds.snaps.slice().sort((a,b)=>a.asof<b.asof?-1:1)
    .map(s=>({date:s.asof,total:snapTotal(s)}))
    .filter(x=>x.total>0);
}

/* ══ พจนานุกรมชื่อ: กระเป๋า + รายตัวทุกตัว + ที่เรียนรู้ ══ */
function buildDict(){
  const d=[];
  db.accounts.forEach(a=>{
    d.push({key:a.id.toLowerCase(),kind:"wallet",id:a.id});
    (WALLET_ALIASES[a.id]||[]).forEach(al=>d.push({key:al.toLowerCase(),kind:"wallet",id:a.id}));
    const w=a.name.replace(/[()•!]/g," ").trim().split(/\s+/)[0];
    if(w && w.length>=3) d.push({key:w.toLowerCase(),kind:"wallet",id:a.id});
  });
  const s=latestSnap();
  if(s) s.items.forEach(h=>d.push({key:h.name.toLowerCase(),kind:"holding",
    name:h.name,grp:normGrp(h.grp),cur:h.cur}));
  Object.values(learned).forEach(l=>d.push({key:l.name.toLowerCase(),kind:"holding",
    name:l.name,grp:l.grp,cur:l.cur}));
  /* ชื่อยาวก่อน กันชนกัน เช่น TLUS500-UH-X ต้องชนะ TLUS500 */
  d.sort((a,b)=>b.key.length-a.key.length);
  return d;
}
const isWordChar=c=>/[a-z0-9ก-๙]/i.test(c||"");

/* หา "ตัวเลขค่า" ตัวแรกในช่วง (ข้ามเลขที่ตามด้วย % หรือนำหน้าด้วย +/-) */
function pickNumber(str){
  const re=/(\d+(?:\.\d+)?)/g; let m;
  while((m=re.exec(str))){
    const before=str.slice(0,m.index).trimEnd().slice(-1);
    const after=str.slice(m.index+m[0].length).trimStart()[0];
    if(before==="+"||before==="-"||before==="−"||before==="(") continue;
    if(after==="%") continue;
    return {val:Number(m[1]), idx:m.index, len:m[0].length};
  }
  return null;
}

/* parse ข้อความอิสระ (ทั้งพิมพ์เองและจาก OCR) */
function parseFree(text, windowed){
  const res={wallet:{},holds:[],unknown:[],fx:null};
  let s=text.replace(/,/g,"");
  s=s.replace(/(?:^|\s)(?:fx|เรท)\s*=?\s*(\d+(?:\.\d+)?)/gi,(m,v)=>{
    const n=Number(v);
    if(n>=15&&n<=60&&res.fx==null){res.fx=n; return " ";}
    return m;   /* เลขนอกช่วงเรทจริง ไม่ใช่ fx */
  });
  const dict=buildDict();
  const low=()=>s.toLowerCase();
  dict.forEach(e=>{
    let from=0;
    while(true){
      const i=low().indexOf(e.key,from);
      if(i<0) break;
      const j=i+e.key.length;
      if(isWordChar(s[i-1])||isWordChar(s[j])){ from=j; continue; }
      /* หน้าต่างหาเลข: ถึงชื่อถัดไปหรือ 90 ตัวอักษร (โหมดรูป) / จบบรรทัด (โหมดพิมพ์) */
      let end;
      if(windowed){ end=Math.min(s.length,j+90);
        dict.forEach(o=>{ if(o===e)return; const k=low().indexOf(o.key,j);
          if(k>=0&&k<end&&!isWordChar(s[k-1])) end=k; });
      }else{
        const nl=s.indexOf("\n",j); end=nl<0?s.length:nl;
      }
      const pick=pickNumber(s.slice(j,end));
      if(pick){
        const abs=j+pick.idx;
        s=s.slice(0,i)+" ".repeat(abs+pick.len-i)+s.slice(abs+pick.len);
        if(e.kind==="wallet") res.wallet[e.id]=pick.val;
        else if(!res.holds.some(h=>h.name===e.name))
          res.holds.push({name:e.name,grp:e.grp,cur:e.cur,val:pick.val});
      }
      from=j;
      break;
    }
  });
  if(!windowed){
    /* ชื่อแปลกใหม่ + ตัวเลข → เก็บไว้ถามผู้ใช้ */
    [...s.matchAll(/([A-Za-zก-๙][A-Za-z0-9ก-๙.\-]{1,29})[ \t:=]+(\d+(?:\.\d+)?)(?!\s*%)/g)]
      .forEach(m=>{
        const nm=m[1], v=Number(m[2]);
        if(/^(fx|เรท|usd|thb|บาท|วันนี้|รวม|แล้ว|เป็น|คือ|ที่|กับ|ทำไม)$/i.test(nm)) return;
        if(v<5) return;   /* เลขเล็กๆ ในประโยคทั่วไป ไม่ใช่มูลค่า */
        res.unknown.push({name:nm,val:v});
      });
  }
  return res;
}

/* ══ บันทึก + ตอบพร้อมเทียบของเก่า ══ */
function applyParsed(p){
  const parts=[];
  let storageFail=false;
  const d=today();

  /* เรทรายวัน — เก็บลง fx diary เสมอ */
  if(p.fx!=null){
    const prevFx=fxPrevBefore(d);
    fxmap[d]=p.fx;
    if(!jsave(KEYFX,fxmap)) storageFail=true;
    let ln="💱 เรทวันนี้ = "+p.fx+" ฿/USD";
    if(prevFx!=null && Math.abs(prevFx-p.fx)>0.001){
      const ch=((p.fx-prevFx)/prevFx*100);
      ln+="  (ก่อนหน้า "+prevFx+" → บาท"+(p.fx>prevFx?"อ่อนลง":"แข็งขึ้น")+" "+Math.abs(ch).toFixed(2)+"%)";
    }
    parts.push(ln);
  }

  /* wallet entries (บันทึกรายวันของกระเป๋า) */
  if(Object.keys(p.wallet).length){
    const es=sorted(), last=es[es.length-1];
    let entry=db.entries.find(x=>x.date===d);
    if(!entry){
      entry={date:d, fx:fxOn(d), vals:last?{...last.vals}:{}};
      db.entries.push(entry);
    }
    if(p.fx!=null) entry.fx=p.fx;
    Object.assign(entry.vals,p.wallet);
    if(!jsave(KEY3,db)) storageFail=true;
    Object.keys(p.wallet).forEach(id=>{
      const a=accById(id);
      parts.push("💼 "+(a?a.name:id)+" = "+fmt(p.wallet[id])+(a&&a.cur==="USD"?" USD":" ฿"));
    });
    const tot=totalOf(entry);
    const prev=sorted().filter(e=>e.date<d).pop();
    let line="\n🧺 รวมพอร์ต "+fmt(tot,0)+" ฿";
    if(prev){ const df=tot-totalOf(prev);
      line+="  ("+sign(df)+fmt(Math.abs(df),0)+" / "+sign(df)+Math.abs(df/totalOf(prev)*100).toFixed(2)+"% จาก "+prev.date+")"; }
    parts.push(line);
  }else if(p.fx!=null){
    /* มีแต่เรท: อัปเดต fx ของ entry วันนี้ถ้ามี */
    const entry=db.entries.find(x=>x.date===d);
    if(entry){ entry.fx=p.fx; if(!jsave(KEY3,db)) storageFail=true; }
  }

  /* holdings (รายตัว — เก็บเป็นประวัติ snapshot) */
  if(p.holds.length){
    const prevSnap=latestSnap();
    let snap=holds.snaps.find(x=>x.asof===d);
    if(!snap){
      snap={asof:d, items:prevSnap?JSON.parse(JSON.stringify(prevSnap.items)):[]};
      holds.snaps.push(snap);
    }
    const fxNew=fxOn(d);
    let anyUsd=false;
    p.holds.forEach(h=>{
      const old=(prevSnap&&prevSnap.asof!==d)
        ? prevSnap.items.find(x=>x.name.toLowerCase()===h.name.toLowerCase())
        : (snap.items.find(x=>x.name.toLowerCase()===h.name.toLowerCase())||null);
      const oldVal=old?old.val:null;
      const it=snap.items.find(x=>x.name.toLowerCase()===h.name.toLowerCase());
      if(it){ it.val=h.val; if(h.grp)it.grp=h.grp; if(h.cur)it.cur=h.cur; }
      else snap.items.push({name:h.name,grp:h.grp||"other",cur:h.cur||"THB",val:h.val});
      const unit=(h.cur==="USD")?" USD":" ฿";
      if(h.cur==="USD") anyUsd=true;
      let ln="🌸 "+h.name+" ("+ (GNAME[h.grp]||"") +") = "+fmt(h.val)+unit;
      if(h.cur==="USD") ln+="  ≈ "+fmt(h.val*fxNew,0)+" ฿";
      if(oldVal!=null && prevSnap && prevSnap.asof!==d && h.cur==="USD"){
        /* แยกให้เห็น: กำไรจากหุ้น vs จากค่าเงิน */
        const fxOld=fxOn(prevSnap.asof);
        const usdP=oldVal?(h.val-oldVal)/oldVal*100:0;
        const thbOld=oldVal*fxOld, thbNew=h.val*fxNew;
        const thbP=thbOld?(thbNew-thbOld)/thbOld*100:0;
        if(Math.abs(fxNew-fxOld)>0.001){
          ln+="\n   💵 ตัวหุ้น "+sign(usdP)+Math.abs(usdP).toFixed(2)+"%"
            +" • เรท "+fxOld+"→"+fxNew
            +" → คิดเป็นบาท "+sign(thbP)+Math.abs(thbP).toFixed(2)+"%";
          if(usdP<0 && thbP>usdP) ln+=" (ค่าเงินช่วยพยุงไว้ 💪)";
          else if(usdP>0 && thbP<usdP) ln+=" (โดนค่าเงินกินไปหน่อย)";
        }else if(oldVal!==h.val){
          ln+="  ("+sign(usdP)+Math.abs(usdP).toFixed(2)+"% จากครั้งก่อน)";
        }
      }else if(oldVal!=null && oldVal!==h.val){
        const df=h.val-oldVal;
        ln+="  ("+sign(df)+fmt(Math.abs(df))+" / "+sign(df)+Math.abs(df/oldVal*100).toFixed(2)+"% จากครั้งก่อน)";
      }else if(oldVal==null) ln+="  (รายการใหม่ 🎀)";
      parts.push(ln);
    });
    if(!jsave(KEY2,holds)) storageFail=true;
    const ht=holdingsTotal();
    if(ht!=null) parts.push("\n💗 รวมรายตัว "+fmt(ht,0)+" ฿  (เรท "+fxNew+")");
    if(anyUsd && fxmap[d]==null && p.fx==null)
      parts.push("💡 เรทที่ใช้ ("+fxNew+") เป็นของวันก่อน — ถ้ามีเรทวันนี้พิมพ์ “fx 33.xx” ได้เลย");
  }

  if(!parts.length) return false;
  let msg="จดให้แล้วค่า ✅ ("+d+")\n"+parts.join("\n");
  msg+="\n\nดูกราฟได้ที่แท็บ 📊 สรุปพอร์ต ด้านล่างเลย";
  if(storageFail) msg+="\n⚠️ เบราว์เซอร์นี้บันทึกถาวรไม่ได้ ข้อมูลจะหายเมื่อปิด";
  bubble(msg,"bot");
  updateTop();
  return true;
}

/* ══ ตอบคำถาม/ข้อความทั่วไป (ไม่มีตัวเลข) ══ */
function smallTalk(text){
  const es=sorted();
  if(/กราฟ|กราฟฟ|พลอต|plot|แนวโน้ม|เทรนด์/i.test(text)){
    bubble("กราฟอยู่แท็บ 📊 สรุปพอร์ต ข้างล่างค่ะ — มีเส้นมูลค่ารวม, อัตราโตรายวัน %, โดนัทสัดส่วน และรายตัวครบเลย 🌷","bot"); return;
  }
  if(/ทำไม|เพราะอะไร/.test(text) && /0|ศูนย์/.test(text)){
    bubble("ที่รวมพอร์ตเป็น 0 เพราะยังไม่มี “บันทึกรายวันของกระเป๋า” เลยค่ะ (Dime/กองทุน/เงินสด)\n\nถ้าเพิ่งเริ่มใช้เครื่องนี้ ข้อมูลเก่าอาจอยู่คนละที่เก็บ — กด 📁 นำเข้าไฟล์ แล้วเลือกไฟล์ backup ที่มีอยู่ได้เลย เดี๋ยวขึ้นครบทุกอย่าง 💕","bot"); return;
  }
  if(/เทียบ|ของเก่า|ก่อนหน้า|เมื่อวาน/.test(text)){ summaryBubble(); return; }
  if(/สวัสดี|หวัดดี|hello|hi/i.test(text)){
    bubble("สวัสดีค่า 🌸 พิมพ์ชื่อ+ตัวเลขมาได้เลย เช่น “TLUS500-UH-X 6499.64” หรือแนบรูปพอร์ตก็ได้นะ","bot"); return;
  }
  bubble("ยังตอบคำถามยาวๆ ไม่เก่งค่า 🥺 แต่ถ้าอยากจด: พิมพ์ชื่อ+ตัวเลข (ชื่ออะไรก็ได้ เดี๋ยวถามต่อเองว่าเป็นหุ้น/กอง/ทอง)\nอยากดูสรุป: พิมพ์ “สรุป” หรือแท็บ 📊 ด้านล่างเลย","bot");
}

function summaryBubble(){
  const es=sorted();
  const snap=latestSnap();
  if(!es.length && !snap){ bubble("ยังไม่มีข้อมูลเลยค่า ✍️ พิมพ์ชื่อ+ตัวเลข หรือกด 📁 นำเข้าไฟล์ backup ก่อนนะ","bot"); return; }
  let m="📊 สรุปพอร์ต\n";
  if(!es.length && snap){
    /* โหมดจดรายตัวล้วน */
    const sr=seriesTotals();
    if(sr.length){
      const last=sr[sr.length-1], prev=sr[sr.length-2], first=sr[0];
      m+="💗 รวมรายตัว ("+last.date+"): "+fmt(last.total,0)+" ฿ (เรท "+fxOn(last.date)+")\n";
      if(prev){ const df=last.total-prev.total;
        m+="• เทียบครั้งก่อน ("+prev.date+"): "+sign(df)+fmt(Math.abs(df),0)+" ("+sign(df)+Math.abs(df/prev.total*100).toFixed(2)+"%)\n"; }
      if(sr.length>1){ const d0=last.total-first.total;
        m+="• ตั้งแต่เริ่ม ("+first.date+"): "+sign(d0)+fmt(Math.abs(d0),0)+" ("+sign(d0)+Math.abs(d0/first.total*100).toFixed(2)+"%)\n"; }
      const byG={}, fx=fxOn(snap.asof);
      snap.items.forEach(h=>{ const k=normGrp(h.grp); byG[k]=(byG[k]||0)+holdThb(h,fx); });
      const t=Object.values(byG).reduce((s,v)=>s+v,0);
      GROUPS.forEach(([k,n])=>{ if(byG[k]) m+="• "+n+": "+fmt(byG[k],0)+" ฿ ("+(byG[k]/t*100).toFixed(1)+"%)\n"; });
    }
    m+="\nกราฟทั้งหมดอยู่แท็บ 📊 สรุปพอร์ต ล่างขวาเลยค่า";
    bubble(m,"bot"); return;
  }
  if(es.length){
    const last=es[es.length-1], first=es[0], prev=es[es.length-2];
    const tot=totalOf(last);
    m+="🧺 รวมพอร์ต ("+last.date+"): "+fmt(tot,0)+" ฿\n";
    if(prev){ const df=tot-totalOf(prev);
      m+="• เทียบครั้งก่อน ("+prev.date+"): "+sign(df)+fmt(Math.abs(df),0)+" ("+sign(df)+Math.abs(df/totalOf(prev)*100).toFixed(2)+"%)\n"; }
    if(es.length>1){ const d0=tot-totalOf(first);
      m+="• ตั้งแต่เริ่ม ("+first.date+"): "+sign(d0)+fmt(Math.abs(d0),0)+" ("+sign(d0)+Math.abs(d0/totalOf(first)*100).toFixed(2)+"%)\n"; }
    const byG={};
    Object.keys(last.vals).forEach(id=>{const a=accById(id);
      const k=a?a.grp:"other"; byG[k]=(byG[k]||0)+thbVal(last,id);});
    GROUPS.forEach(([k,n])=>{ if(byG[k]) m+="• "+n+": "+fmt(byG[k],0)+" ฿ ("+(byG[k]/totalOf(last)*100).toFixed(1)+"%)\n"; });
  }
  if(snap && snap.items.length){
    m+="\n💗 รายตัวล่าสุด ("+snap.asof+"): "+snap.items.length+" รายการ";
    const ht=holdingsTotal();
    if(ht!=null) m+=" รวม "+fmt(ht,0)+" ฿";
  }
  m+="\n\nกราฟทั้งหมดอยู่แท็บ 📊 สรุปพอร์ต ล่างขวาเลยค่า";
  bubble(m,"bot");
}

}

    const d=document.createElement("div"); d.className="bub bot";

    t.textContent="จับคู่ชื่ออัตโนมัติไม่ได้ค่า 🥺 แต่เจอตัวเลขพวกนี้ แตะเพื่อใส่ช่องพิมพ์แล้วเติมชื่อข้างหน้าได้เลย";
    d.appendChild(t);
    const chips=document.createElement("div"); chips.className="chips";
    nums.forEach(n=>{ const c=document.createElement("button"); c.className="chip-num";
      c.type="button"; c.textContent=fmt(n);
      c.addEventListener("click",()=>{ const inp=document.getElementById("inp");
        inp.value=(inp.value?inp.value+" ":"")+n+" "; inp.focus(); });
      chips.appendChild(c); });
    d.appendChild(chips); msgs.appendChild(d); scrollBottom();
  }catch(e){
    st.remove();
    bubble("อ่านรูปไม่สำเร็จค่า 🥺 (โหลดตัวอ่านไม่ได้ หรือรูปไม่ชัด) พิมพ์ตัวเลขเองได้เลยนะ","bot");
  }
});

/* ══ นำเข้า/สำรองไฟล์ (Moni อาจอยู่คนละที่เก็บกับแอปหลักบน iOS) ══ */
document.getElementById("q-import").addEventListener("click",()=>document.getElementById("jfile").click());
document.getElementById("jfile").addEventListener("change",ev=>{
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d && (d.v===2||d.v===3) && Array.isArray(d.accounts) && Array.isArray(d.entries)){
        db={accounts:d.accounts,entries:d.entries}; jsave(KEY3,db);
        if(d.holdings){ holds=d.holdings.snaps?d.holdings:
          {snaps:[{asof:d.holdings.asof||"",items:d.holdings.items||[]}]}; jsave(KEY2,holds); }
      }else{
        const entries=Array.isArray(d)?d:(d&&d.entries);
        if(!Array.isArray(entries)||!entries.every(x=>x.date&&typeof x.usd==="number")) throw 0;
        db={accounts:JSON.parse(JSON.stringify(DEF_ACCOUNTS)),
            entries:entries.map(e=>({date:e.date,fx:e.fx,vals:{dime:e.usd,wxgen:e.gen,wxtax:e.tax,
              bank:Math.max(0,Math.round((e.cash-0.33-7.34*e.fx)*100)/100),dsave:0.33,fcd:7.34}}))};
        jsave(KEY3,db);
      }
      updateTop();
      bubble("นำเข้าข้อมูลสำเร็จค่า 🎉 มี "+db.entries.length+" วัน"+
        (latestSnap()?(" + รายตัว "+latestSnap().items.length+" รายการ"):"")+
        "\nกดแท็บ 📊 ดูกราฟได้เลย","bot");
    }catch(e){ bubble("ไฟล์ไม่ถูกต้องค่า 🥺 ต้องเป็นไฟล์ backup .json จากแอปเรานะ","bot"); }
  };
  rd.readAsText(f);
});
document.getElementById("q-export").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify({v:3,accounts:db.accounts,entries:db.entries,holdings:holds},null,2)],
                      {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="portfolio-backup-"+today()+".json";
  a.click(); URL.revokeObjectURL(a.href);
  bubble("ดาวน์โหลดไฟล์สำรองแล้วค่า 💾 เก็บไว้ดีๆ นะ","bot");
});

/* ══ top + celebrate ══ */
function updateTop(){
  const sr=seriesTotals();
  const tEl=document.getElementById("top-total"), dEl=document.getElementById("top-diff");
  if(!sr.length){ tEl.textContent="—"; dEl.textContent=""; return; }
  const last=sr[sr.length-1], prev=sr[sr.length-2];
  tEl.textContent=fmt(last.total,0)+" ฿";
  if(prev){ const df=last.total-prev.total;
    dEl.textContent=sign(df)+fmt(Math.abs(df),0)+" จากครั้งก่อน"; }
  else dEl.textContent=last.date;
}

/* ══ dashboard (เหมือนเดิม) ══ */
function countUp(el,target){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){
    el.textContent=fmt(target,0)+" ฿"; return; }
  const t0=performance.now(), dur=700, from=target*0.85;
  function step(t){
    const k=Math.min(1,(t-t0)/dur), v=from+(target-from)*(1-Math.pow(1-k,3));
    el.textContent=fmt(v,0)+" ฿";
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function renderDash(){
  const sr=seriesTotals();
  const totalEl=document.getElementById("d-total");
  if(!sr.length){ totalEl.textContent="—"; return; }
  const last=sr[sr.length-1], prev=sr[sr.length-2], first=sr[0];
  countUp(totalEl,last.total);
  const day=document.getElementById("d-day"), since=document.getElementById("d-since");
  if(prev){
    const df=last.total-prev.total, pc=df/prev.total*100;
    day.className="pill "+cls(df);
    day.textContent="วันนี้ "+sign(df)+fmt(Math.abs(df),0)+" ("+sign(df)+Math.abs(pc).toFixed(2)+"%)";
  }else{ day.className="pill flat"; day.textContent="วันนี้ —"; }
  if(sr.length>1){
    const d0=last.total-first.total, p0=d0/first.total*100;
    since.className="pill "+cls(d0);
    since.textContent="ตั้งแต่เริ่ม "+sign(d0)+fmt(Math.abs(d0),0)+" ("+sign(d0)+Math.abs(p0).toFixed(2)+"%)";
  }else{ since.className="pill flat"; since.textContent="ตั้งแต่เริ่ม —"; }
  drawLine(sr); drawGrowth(sr);
  const es=sorted();
  const ctx=es.length?es[es.length-1]:{vals:{},fx:lastFx()};
  drawDonut(ctx); drawHoldings(ctx);
}

const NS="http://www.w3.org/2000/svg";
const el=(n,at)=>{const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);return e;};

function drawLine(es){
  /* es = [{date,total}] */
  const svg=document.getElementById("line"), tt=document.getElementById("line-tt");
  svg.textContent="";
  const W=460,H=210,L=58,R=14,T=12,B=26;
  const ts=es.map(s=>s.total);
  let lo=Math.min(...ts),hi=Math.max(...ts);
  if(lo===hi){lo-=100;hi+=100;}
  const pad=(hi-lo)*.15; lo-=pad; hi+=pad;
  const step=Math.pow(10,Math.floor(Math.log10(hi-lo)))/2;
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const X=i=>es.length===1?(L+(W-L-R)/2):L+(W-L-R)*i/(es.length-1);
  const Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  for(let i=0;i<=3;i++){
    const v=lo+(hi-lo)*i/3, y=Y(v);
    svg.appendChild(el("line",{x1:L,x2:W-R,y1:y,y2:y,stroke:"var(--grid)","stroke-width":1}));
    const tx=el("text",{x:L-7,y:y+4,"text-anchor":"end","font-size":10,fill:"var(--muted)"});
    tx.textContent=Math.round(v).toLocaleString("th-TH"); svg.appendChild(tx);
  }
  svg.appendChild(el("line",{x1:L,x2:W-R,y1:H-B,y2:H-B,stroke:"var(--baseline)","stroke-width":1}));
  const idxs=es.length<=3?es.map((_,i)=>i):[0,Math.floor((es.length-1)/2),es.length-1];
  [...new Set(idxs)].forEach(i=>{
    const tx=el("text",{x:X(i),y:H-8,"text-anchor":"middle","font-size":10,fill:"var(--muted)"});
    tx.textContent=es[i].date.slice(5); svg.appendChild(tx);
  });
  const pts=es.map((e,i)=>[X(i),Y(e.total)]);
  if(es.length>1){
    svg.appendChild(el("path",{d:"M"+pts.map(p=>p.join(" ")).join(" L ")+
      ` L ${pts[pts.length-1][0]} ${H-B} L ${pts[0][0]} ${H-B} Z`,fill:"var(--accent)",opacity:.09}));
    svg.appendChild(el("path",{d:"M"+pts.map(p=>p.join(" ")).join(" L "),fill:"none",
      stroke:"var(--accent)","stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
  }
  const cross=el("line",{y1:T,y2:H-B,stroke:"var(--baseline)","stroke-width":1,visibility:"hidden"});
  svg.appendChild(cross);
  pts.forEach(p=>{
    svg.appendChild(el("circle",{cx:p[0],cy:p[1],r:6,fill:"var(--surface)"}));
    svg.appendChild(el("circle",{cx:p[0],cy:p[1],r:4,fill:"var(--accent)"}));
  });
  const lastP=pts[pts.length-1];
  const lb=el("text",{x:Math.min(lastP[0],W-R-4),y:lastP[1]-11,"text-anchor":"end",
    "font-size":11,"font-weight":700,fill:"var(--ink2)"});
  lb.textContent=fmt(ts[ts.length-1],0); svg.appendChild(lb);
  svg.style.touchAction="none";
  svg.addEventListener("pointermove",ev=>{
    const r=svg.getBoundingClientRect(), mx=(ev.clientX-r.left)*(W/r.width);
    let best=0,bd=1e9;
    pts.forEach((p,i)=>{const d=Math.abs(p[0]-mx); if(d<bd){bd=d;best=i;}});
    cross.setAttribute("x1",pts[best][0]); cross.setAttribute("x2",pts[best][0]);
    cross.setAttribute("visibility","visible");
    const host=svg.parentElement.getBoundingClientRect();
    tt.style.display="block";
    tt.style.left=Math.min(pts[best][0]*(r.width/W),host.width-130)+"px";
    tt.style.top=Math.max(0,pts[best][1]*(r.height/H)-46)+"px";
    tt.textContent="";
    const v=document.createElement("div"); v.className="t-val"; v.textContent=fmt(ts[best],0)+" ฿";
    const l=document.createElement("div"); l.className="t-lbl"; l.textContent=es[best].date;
    tt.append(v,l);
  });
  svg.addEventListener("pointerleave",()=>{tt.style.display="none";cross.setAttribute("visibility","hidden");});
}

function drawGrowth(es){
  const svg=document.getElementById("growth"), empty=document.getElementById("growth-empty");
  svg.textContent="";
  if(es.length<2){ empty.style.display="block"; svg.style.display="none"; return; }
  empty.style.display="none"; svg.style.display="";
  const W=460,H=150,L=44,R=10,T=12,B=24;
  const pcs=[];
  for(let i=1;i<es.length;i++){
    const a=es[i-1].total, b=es[i].total;
    pcs.push({date:es[i].date, pc:a?(b-a)/a*100:0});
  }
  let mx=Math.max(.3,...pcs.map(p=>Math.abs(p.pc)));
  const Y=v=>T+(H-T-B)*(1-(v+mx)/(2*mx));
  const zero=Y(0);
  svg.appendChild(el("line",{x1:L,x2:W-R,y1:zero,y2:zero,stroke:"var(--baseline)","stroke-width":1}));
  const n=pcs.length, slot=(W-L-R)/n, bw=Math.min(24,slot*.55);
  pcs.forEach((p,i)=>{
    const x=L+slot*i+(slot-bw)/2, y=Y(Math.max(0,p.pc)), h=Math.abs(Y(p.pc)-zero);
    const up=p.pc>=0, r=Math.min(4,h);
    const d= up
      ? `M${x} ${zero} L${x} ${y+r} Q${x} ${y} ${x+r} ${y} L${x+bw-r} ${y} Q${x+bw} ${y} ${x+bw} ${y+r} L${x+bw} ${zero} Z`
      : `M${x} ${zero} L${x} ${zero+h-r} Q${x} ${zero+h} ${x+r} ${zero+h} L${x+bw-r} ${zero+h} Q${x+bw} ${zero+h} ${x+bw} ${zero+h-r} L${x+bw} ${zero} Z`;
    svg.appendChild(el("path",{d,fill:up?"#0ca30c":"#d03b3b"}));
    const tx=el("text",{x:x+bw/2,y:up?y-5:zero+h+11,"text-anchor":"middle","font-size":9.5,
      "font-weight":700,fill:up?"var(--up)":"var(--down)"});
    tx.textContent=(up?"+":"−")+Math.abs(p.pc).toFixed(2)+"%";
    svg.appendChild(tx);
    const dx=el("text",{x:x+bw/2,y:H-8,"text-anchor":"middle","font-size":9,fill:"var(--muted)"});
    dx.textContent=p.date.slice(5); svg.appendChild(dx);
  });
}

function polar(cx,cy,r,a){return [cx+r*Math.cos(a-Math.PI/2),cy+r*Math.sin(a-Math.PI/2)];}
function arcPath(cx,cy,r0,r1,a0,a1){
  const [x0,y0]=polar(cx,cy,r1,a0),[x1,y1]=polar(cx,cy,r1,a1),
        [x2,y2]=polar(cx,cy,r0,a1),[x3,y3]=polar(cx,cy,r0,a0),
        big=(a1-a0)>Math.PI?1:0;
  return `M${x0} ${y0} A${r1} ${r1} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${r0} ${r0} 0 ${big} 0 ${x3} ${y3} Z`;
}
function drawDonut(last){
  const svg=document.getElementById("donut"), lg=document.getElementById("legend");
  svg.textContent=""; lg.textContent="";
  const byG={};
  Object.keys(last.vals).forEach(id=>{
    const a=accById(id), k=a?a.grp:"other";
    byG[k]=(byG[k]||0)+thbVal(last,id);
  });
  /* ไม่มีบันทึกกระเป๋า → ใช้สัดส่วนจากรายตัวแทน */
  if(!Object.values(byG).reduce((s,v)=>s+v,0)){
    const s=latestSnap();
    if(s){ const fx=fxOn(s.asof);
      s.items.forEach(h=>{ const k=normGrp(h.grp);
        byG[k]=(byG[k]||0)+holdThb(h,fx); }); }
  }
  const t=Object.values(byG).reduce((s,v)=>s+v,0);
  if(!t) return;
  const parts=GROUPS.filter(([k])=>byG[k]>0).map(([k,n])=>({k,n,v:byG[k]}));
  const cx=70,cy=70,r0=42,r1=66,pad=2/54;
  let a=0;
  parts.forEach(p=>{
    const a1=a+p.v/t*2*Math.PI;
    svg.appendChild(el("path",{d:arcPath(cx,cy,r0,r1,a+pad/2,Math.max(a+pad,a1-pad/2)),
      fill:grpColor(p.k)}));
    a=a1;
  });
  parts.forEach(p=>{
    const li=document.createElement("li");
    const dot=document.createElement("span"); dot.className="dot"; dot.style.background=grpColor(p.k);
    const nm=document.createElement("span"); nm.className="nm"; nm.textContent=p.n;
    const v=document.createElement("span"); v.className="v"; v.textContent=fmt(p.v,0);
    const pc=document.createElement("span"); pc.className="pc"; pc.textContent=(p.v/t*100).toFixed(1)+"%";
    li.append(dot,nm,v,pc); lg.appendChild(li);
  });
}

function drawHoldings(last){
  const box=document.getElementById("holdings"), empty=document.getElementById("hold-empty");
  box.textContent="";
  const snap=latestSnap();
  document.getElementById("h-asof").textContent=snap?"("+snap.asof+" • เรท "+fxOn(snap.asof)+")":"";
  const fx=snap?fxOn(snap.asof):lastFx();
  const rows=snap?snap.items.map(h=>({name:h.name,grp:normGrp(h.grp),
    thb:h.cur==="USD"?h.val*fx:h.val})):[];
  const cash=cashOf(last);
  if(cash>0) rows.push({name:"เงินสด / Cash",grp:"cash",thb:cash});
  if(!rows.length){ empty.style.display="block"; return; }
  empty.style.display="none";
  rows.sort((a,b)=>b.thb-a.thb);
  const t=rows.reduce((s,r)=>s+r.thb,0), mx=rows[0].thb;
  rows.forEach(r=>{
    const row=document.createElement("div"); row.className="hrow";
    const nm=document.createElement("div"); nm.className="nm";
    const dot=document.createElement("span"); dot.className="dot"; dot.style.background=grpColor(r.grp);
    nm.appendChild(dot); nm.appendChild(document.createTextNode(r.name)); nm.title=r.name;
    const track=document.createElement("div"); track.className="track";
    const fill=document.createElement("div"); fill.className="fill";
    fill.style.width=Math.max(2,r.thb/mx*100)+"%"; fill.style.background=grpColor(r.grp);
    track.appendChild(fill);
    const v=document.createElement("div"); v.className="v"; v.textContent=fmt(r.thb,0);
    const pc=document.createElement("div"); pc.className="pc"; pc.textContent=(r.thb/t*100).toFixed(1)+"%";
    row.append(nm,track,v,pc); box.appendChild(row);
  });
}
